services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote_dev
      POSTGRES_DB: vote
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
